<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Trial class certificate preview</title>
  <desc id="desc">Certificate preview for trial class certificate.</desc>
  <rect width="800" height="1000" fill="#f8f7f3"/>
  <rect x="40" y="40" width="720" height="920" rx="28" fill="#fff" stroke="#d9b568" stroke-width="4"/>
  <rect x="70" y="70" width="660" height="860" rx="18" fill="none" stroke="#d9b568" stroke-width="2"/>
  <text x="400" y="180" text-anchor="middle" fill="#0c1730" font-size="30" font-family="Verdana, Arial, sans-serif" letter-spacing="4">CODINGAL</text>
  <text x="400" y="260" text-anchor="middle" fill="#d7a437" font-size="36" font-weight="700" font-family="Verdana, Arial, sans-serif">TRIAL CLASS CERTIFICATE</text>
  <text x="400" y="350" text-anchor="middle" fill="#3d4f6d" font-size="20" font-family="Verdana, Arial, sans-serif">This certifies participation in a trial session</text>
  <rect x="180" y="430" width="440" height="160" rx="18" fill="#f2efe8" stroke="#d9b568" stroke-width="2"/>
  <text x="400" y="495" text-anchor="middle" fill="#0c1730" font-size="18" font-family="Verdana, Arial, sans-serif">Awarded to</text>
  <text x="400" y="545" text-anchor="middle" fill="#0c1730" font-size="34" font-weight="700" font-family="Verdana, Arial, sans-serif">Rooh Ali</text>
  <line x1="170" y1="670" x2="320" y2="670" stroke="#d9b568" stroke-width="3"/>
  <line x1="480" y1="670" x2="630" y2="670" stroke="#d9b568" stroke-width="3"/>
  <text x="245" y="715" fill="#3d4f6d" font-size="18" font-family="Verdana, Arial, sans-serif">Mentor</text>
  <text x="555" y="715" fill="#3d4f6d" font-size="18" font-family="Verdana, Arial, sans-serif">Date</text>
  <text x="400" y="820" text-anchor="middle" fill="#d7a437" font-size="22" font-weight="700" font-family="Verdana, Arial, sans-serif">CODINGAL</text>
</svg>
